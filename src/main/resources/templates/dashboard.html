<!DOCTYPE html>
<html>
<head>
<title>Smart Faculty System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f8fb;
}

.screen {
    display: none;
}

.center-box {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
</style>

</head>

<body>

<!-- 🔵 START SCREEN -->
<div id="startScreen" class="screen center-box" style="display:block;">
    <div class="text-center">
        <h1 class="mb-4">🎓 Faculty Management System</h1>
        <button class="btn btn-primary btn-lg" onclick="showScreen('menuScreen')">
            Start
        </button>
    </div>
</div>

<!-- 🔵 MENU SCREEN -->
<div id="menuScreen" class="screen center-box">
    <div class="text-center">
        <h2 class="mb-4">Choose Action</h2>

        <button class="btn btn-success m-2" onclick="showScreen('addScreen'); loadFaculty();">
            ➕ Add Faculty
        </button>

        <button class="btn btn-info m-2" onclick="showScreen('viewScreen'); loadFaculty();">
            👀 View Faculty
        </button>

        <br><br>
        <button class="btn btn-secondary" onclick="showScreen('startScreen')">
            ⬅ Back
        </button>
    </div>
</div>

<!-- 🔵 ADD SCREEN -->
<div id="addScreen" class="screen container mt-5">

<h2>Add Faculty</h2>

<input id="name" class="form-control mb-2" placeholder="Name">
<input id="email" class="form-control mb-2" placeholder="Email">
<input id="department" class="form-control mb-2" placeholder="Department">
<input id="subject" class="form-control mb-2" placeholder="Subject">
<input id="workload" class="form-control mb-3" placeholder="Workload">

<button class="btn btn-primary" onclick="addFaculty()">Add</button>
<button class="btn btn-secondary" onclick="showScreen('menuScreen')">Back</button>

<hr>

<h4>Faculty List</h4>
<table class="table table-bordered">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Subject</th>
<th>Workload</th>
<th>Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

</div>

<!-- 🔵 VIEW SCREEN -->
<div id="viewScreen" class="screen container mt-5">

<h2>View Faculty</h2>

<button class="btn btn-secondary mb-3" onclick="showScreen('menuScreen')">Back</button>

<table class="table table-striped">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Subject</th>
<th>Workload</th>
</tr>
</thead>

<tbody id="viewTable"></tbody>
</table>

</div>

<script>

// 🔥 SCREEN SWITCH (FIXED)
function showScreen(screenId) {

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("menuScreen").style.display = "none";
    document.getElementById("addScreen").style.display = "none";
    document.getElementById("viewScreen").style.display = "none";

    document.getElementById(screenId).style.display = "block";
}

// 🔥 ADD FACULTY
function addFaculty() {

    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        department: document.getElementById("department").value,
        subject: document.getElementById("subject").value,
        workload: document.getElementById("workload").value
    };

    fetch("http://localhost:5050/api/faculty", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(() => {
        alert("Added ✅");
        clearForm();
        loadFaculty();
    });
}

// 🔥 LOAD DATA
function loadFaculty() {

    fetch("http://localhost:5050/api/faculty")
    .then(res => res.json())
    .then(data => {

        let rows = "";
        let viewRows = "";

        data.forEach(f => {

            rows += `<tr>
                <td>${f.name}</td>
                <td>${f.email}</td>
                <td>${f.department}</td>
                <td>${f.subject}</td>
                <td>${f.workload}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteFaculty(${f.id})">
                    Delete
                    </button>
                </td>
            </tr>`;

            viewRows += `<tr>
                <td>${f.name}</td>
                <td>${f.email}</td>
                <td>${f.department}</td>
                <td>${f.subject}</td>
                <td>${f.workload}</td>
            </tr>`;
        });

        document.getElementById("tableBody").innerHTML = rows;
        document.getElementById("viewTable").innerHTML = viewRows;
    });
}

// 🔥 DELETE
function deleteFaculty(id) {
    fetch(`http://localhost:5050/api/faculty/${id}`, {
        method: "DELETE"
    })
    .then(() => {
        loadFaculty();
    });
}

// 🔥 CLEAR FORM
function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("department").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("workload").value = "";
}

</script>

</body>
</html>
